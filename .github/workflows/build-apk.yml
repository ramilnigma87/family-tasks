name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.13.0

      - name: Create twa.json config
        run: |
          mkdir -p twa
          cat > twa/twa-manifest.json << 'JSON'
          {
            "packageId": "com.nigma.family",
            "host": "nigma-family.duckdns.org",
            "name": "Семейные дела",
            "launcherName": "Дела",
            "display": "standalone",
            "themeColor": "#03020A",
            "navigationColor": "#03020A",
            "backgroundColor": "#03020A",
            "startUrl": "/",
            "iconUrl": "https://nigma-family.duckdns.org/icon-512.png",
            "maskableIconUrl": "https://nigma-family.duckdns.org/icon-512.png",
            "appVersion": "1",
            "appVersionCode": 1,
            "signingMode": "none",
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://nigma-family.duckdns.org/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {},
            "enableNotifications": false,
            "shortcuts": [],
            "generatedAppVersion": "1.13.0",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://nigma-family.duckdns.org/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          JSON

      - name: Build APK
        run: |
          cd twa
          bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-apk
          path: twa/app-release-unsigned.apk
