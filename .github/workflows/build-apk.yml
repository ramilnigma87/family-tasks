name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          mkdir twa && cd twa
          bubblewrap init \
            --manifest https://nigma-family.duckdns.org/manifest.json \
            --directory . \
            --packageId com.nigma.family \
            --name "Семейные дела" \
            --shortName "Дела" \
            --themeColor "#03020A" \
            --backgroundColor "#03020A" \
            --startUrl "/" \
            --iconUrl https://nigma-family.duckdns.org/icon-512.png \
            --maskableIconUrl https://nigma-family.duckdns.org/icon-512.png
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"

      - name: Build APK
        run: |
          cd twa
          bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-tasks-apk
          path: twa/app-release-unsigned.apk
