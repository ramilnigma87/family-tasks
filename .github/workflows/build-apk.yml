name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build TWA APK
        uses: chromeos/twa-action@v1
        with:
          manifest-url: https://nigma-family.duckdns.org/manifest.json
          package-id: com.nigma.family
          signing-key-store-base64: ''
          signing-key-alias: ''
          signing-key-store-password: ''
          signing-key-password: ''

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-tasks-apk
          path: '**/*.apk'
